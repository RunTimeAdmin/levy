<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="t d">
  <title id="t">Levy subscription lifecycle</title>
  <desc id="d">The states of the SubscriptionManager Status enum and the calls and events that move a subscription between them.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5563"/>
    </marker>
    <marker id="ah-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#1f8a5b"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
      .state { fill: #e9f6ef; stroke: #2f855a; stroke-width: 1.3; }
      .state-main { fill: #d5f0e2; stroke: #1f7a52; stroke-width: 1.8; }
      .state-end { fill: #f1f3f5; stroke: #8a94a0; stroke-width: 1.3; }
      .name { fill: #14202b; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
      .lbl { fill: #3b4756; font-size: 13px; }
      .note { fill: #6b7684; font-size: 12px; }
      .ln { stroke: #4a5563; stroke-width: 1.5; fill: none; }
      .ok { stroke: #1f8a5b; stroke-width: 1.7; fill: none; }
      .group { fill: #fbfdfc; stroke: #9aa5b1; stroke-width: 1.2; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="920" height="520" fill="#ffffff"/>

  <!-- The chargeable states: charge() works on these once the billing date arrives. -->
  <rect class="group" x="200" y="60" width="660" height="270" rx="14"/>
  <text class="note" x="848" y="320" text-anchor="end">chargeable states</text>

  <!-- Entry -->
  <circle cx="50" cy="220" r="8" fill="#3b4756"/>
  <path class="ln" d="M57 214 C 110 170, 150 118, 223 114" marker-end="url(#ah)"/>
  <text class="lbl" x="36" y="116">subscribe,</text>
  <text class="lbl" x="36" y="132">plan has a trial</text>
  <path class="ln" d="M58 226 L 458 279" marker-end="url(#ah)"/>
  <text class="lbl" x="66" y="270">subscribe, no trial</text>
  <text class="lbl" x="66" y="286">(first cycle paid)</text>

  <!-- States -->
  <rect class="state" x="225" y="90" width="130" height="48" rx="9"/>
  <text class="name" x="290" y="119" text-anchor="middle">TRIAL</text>
  <rect class="state" x="690" y="90" width="150" height="48" rx="9"/>
  <text class="name" x="765" y="119" text-anchor="middle">PAST_DUE</text>
  <rect class="state-main" x="460" y="255" width="140" height="50" rx="9"/>
  <text class="name" x="530" y="285" text-anchor="middle">ACTIVE</text>
  <rect class="state" x="455" y="420" width="150" height="48" rx="9"/>
  <text class="name" x="530" y="449" text-anchor="middle">PAUSED</text>
  <rect class="state-end" x="225" y="420" width="150" height="48" rx="9"/>
  <text class="name" x="300" y="449" text-anchor="middle">CANCELLED</text>
  <text class="note" x="300" y="488" text-anchor="middle">final: cannot be resumed</text>

  <!-- Billing -->
  <path class="ok" d="M322 140 L 470 252" marker-end="url(#ah-ok)"/>
  <text class="lbl" x="396" y="214" text-anchor="end">first charge succeeds</text>

  <path class="ln" d="M357 108 L 688 108" marker-end="url(#ah)"/>
  <text class="lbl" x="522" y="99" text-anchor="middle">failures reach maxFailed</text>

  <path class="ln" d="M585 253 L 704 141" marker-end="url(#ah)"/>
  <text class="lbl" x="628" y="187" text-anchor="end">failures reach</text>
  <text class="lbl" x="628" y="203" text-anchor="end">maxFailed</text>

  <path class="ok" d="M728 140 L 603 271" marker-end="url(#ah-ok)"/>
  <text class="lbl" x="692" y="214">charge</text>
  <text class="lbl" x="692" y="230">succeeds</text>

  <!-- Pause and resume -->
  <path class="ln" d="M560 332 L 560 418" marker-end="url(#ah)"/>
  <text class="lbl" x="570" y="368">pause, from any</text>
  <text class="lbl" x="570" y="384">chargeable state</text>

  <path class="ok" d="M500 418 L 500 307" marker-end="url(#ah-ok)"/>
  <text class="lbl" x="490" y="368" text-anchor="end">resume</text>
  <text class="lbl" x="490" y="384" text-anchor="end">(fresh start)</text>

  <path class="ln" d="M842 114 L 895 114 L 895 444 L 607 444" marker-end="url(#ah)"/>
  <text class="lbl" x="880" y="434" text-anchor="end">failures reach 2 × maxFailed (AutoPaused)</text>

  <!-- Cancel -->
  <path class="ln" d="M300 332 L 300 418" marker-end="url(#ah)"/>
  <text class="lbl" x="290" y="368" text-anchor="end">cancel, from any</text>
  <text class="lbl" x="290" y="384" text-anchor="end">chargeable state</text>

  <path class="ln" d="M453 444 L 377 444" marker-end="url(#ah)"/>
  <text class="lbl" x="415" y="435" text-anchor="middle">cancel</text>
</svg>
