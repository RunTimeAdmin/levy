# Soak-only services (ops/testnet-soak.md). Not part of production.
#
#   cd /docker/levy
#   mkdir -p ops/soak/data && chown 1000:1000 ops/soak/data
#   docker compose -f ops/soak/docker-compose.yml up -d
#
# nginx on the host proxies https://app.getlevy.xyz/soak-hooks to 127.0.0.1:3002.
# The endpoint is public, so it is rate limited. Add the zone next to the
# file's other limit_req_zone (outside the server block) and the location
# inside the app.getlevy.xyz server block, then `nginx -t && systemctl reload nginx`:
#
#     limit_req_zone $binary_remote_addr zone=levy_soak:1m rate=60r/m;
#
#     location ^~ /soak-hooks {
#         limit_req zone=levy_soak burst=30 nodelay;
#         limit_req_status 429;
#         proxy_pass http://127.0.0.1:3002;
#         include /etc/nginx/proxy_params;
#     }
#
# WEBHOOK_ID must be the id the dashboard shows for the /soak-hooks endpoint
# (1 on a fresh database); the receiver verifies signatures against it.
#
# Remove both after the soak (ops/testnet-soak.md, After the soak).

name: levy-soak

services:
  hooks:
    image: node:24-slim
    container_name: levy-soak-hooks
    command: ["node", "/soak/webhook-receiver.mjs"]
    user: "1000:1000"
    environment:
      PUBLIC_KEY_URL: https://app.getlevy.xyz/api/webhooks/public-key
      LOG_PATH: /data/hooks.jsonl
      WEBHOOK_ID: ${SOAK_WEBHOOK_ID:-1}
      MERCHANT: "0x83F45b842c15c1417fDbCE296D966b1CE17544bD"
    volumes:
      - ./webhook-receiver.mjs:/soak/webhook-receiver.mjs:ro
      - ./data:/data
    ports:
      - "127.0.0.1:3002:3002"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
