# Levy production stack: keeper (charging, dunning, webhook delivery) + API
# (REST, dashboard, portal, checkout).
#
# Usage:
#   cp ops/.env.example ops/.env   # fill in secrets + addresses (NEVER commit ops/.env)
#   docker compose -f ops/docker-compose.yml --env-file ops/.env up -d --build
#
# Both services share one SQLite DB and the webhook signing key via the
# levy-data volume. The keeper does most of the writing; the API writes webhook
# registrations and sign-in challenges and sessions. SQLite in WAL mode handles
# this fine on a single host (both set busy_timeout).

# Fixed project name: without it compose names the project after this folder
# ("ops"), which is too generic on a shared host.
name: levy

services:
  keeper:
    build:
      context: ../keeper
      dockerfile: ../ops/Dockerfile.keeper
    image: levy-keeper:latest
    container_name: levy-keeper
    env_file:
      - .env
    environment:
      # Force DB + signing key onto the shared volume regardless of .env values.
      LEVY_DB_PATH: /data/levy.db
      LEVY_WEBHOOK_KEY_PATH: /data/webhook-signing-key.pem
    volumes:
      - levy-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  api:
    build:
      # Repo root: the API imports keeper/src. See /.dockerignore.
      context: ..
      dockerfile: ops/Dockerfile.api
    image: levy-api:latest
    container_name: levy-api
    # No env_file: .env holds LEVY_KEEPER_KEY (the keeper's gas key) and LEVY_RPC_URL,
    # which the API never reads (SECURITY_REVIEW.md §9 item 14). It gets only what
    # api/src/server.ts reads, filled in from ops/.env; the Dockerfile sets NODE_ENV and
    # LEVY_API_HOST. Defaults match the keeper's, and an empty value reads as unset
    # (LEVY_WEBHOOK_KEY empty means "use the key file", as in the keeper).
    environment:
      LEVY_PUBLIC_ORIGIN: ${LEVY_PUBLIC_ORIGIN:?set LEVY_PUBLIC_ORIGIN in ops/.env}
      LEVY_CHAIN_ID: ${LEVY_CHAIN_ID:-5042}
      LEVY_MANAGER_ADDRESS: ${LEVY_MANAGER_ADDRESS:?set LEVY_MANAGER_ADDRESS in ops/.env}
      LEVY_USDC_ADDRESS: ${LEVY_USDC_ADDRESS:?set LEVY_USDC_ADDRESS in ops/.env}
      LEVY_WEBHOOK_KEY: ${LEVY_WEBHOOK_KEY:-}
      LEVY_WEBHOOK_ALLOW_PRIVATE: ${LEVY_WEBHOOK_ALLOW_PRIVATE:-}
      LEVY_DB_PATH: /data/levy.db
      LEVY_WEBHOOK_KEY_PATH: /data/webhook-signing-key.pem
      # Fixed inside the container; LEVY_API_PORT only picks the host port.
      LEVY_API_PORT: "3001"
    ports:
      # Host loopback only: put a TLS reverse proxy (nginx/Caddy) in front, and
      # rate-limit POST /api/auth/challenge there (see api/README.md).
      - "127.0.0.1:${LEVY_API_PORT:-3001}:3001"
    volumes:
      - levy-data:/data
    restart: unless-stopped
    depends_on:
      - keeper
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  levy-data:
    name: levy-data
