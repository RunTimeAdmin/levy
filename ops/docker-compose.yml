# Levy production stack: keeper (charging, dunning, webhook delivery) + API
# (REST, dashboard, portal, checkout).
#
# Usage, in this order (set-keeper-key.sh needs the keeper image, and `up`
# needs ops/keeper.env, which the script writes):
#   cp ops/.env.example ops/.env   # addresses and settings (NEVER commit ops/.env)
#   docker compose -f ops/docker-compose.yml --env-file ops/.env build
#   bash ops/set-keeper-key.sh     # writes the keeper's key to ops/keeper.env
#   docker compose -f ops/docker-compose.yml --env-file ops/.env up -d
#
# Both services share one SQLite DB on the levy-data volume. The keeper does
# most of the writing; the API writes webhook registrations and sign-in
# challenges and sessions. SQLite in WAL mode handles this fine on a single
# host (both set busy_timeout).
#
# Secrets stay with the keeper: ops/keeper.env (the gas key) is read by the
# keeper only, and the webhook signing key lives on levy-keys, which only the
# keeper mounts. The keeper publishes the public key to levy-data for the API
# to serve, and the API refuses to start if it sees either secret.

# Fixed project name: without it compose names the project after this folder
# ("ops"), which is too generic on a shared host.
name: levy

services:
  keeper:
    build:
      context: ../keeper
      dockerfile: ../ops/Dockerfile.keeper
    image: levy-keeper:latest
    container_name: levy-keeper
    env_file:
      - .env
      - keeper.env
    environment:
      # Fixed paths regardless of .env values: the DB and public key on the
      # shared volume, the signing key on the keeper's own.
      LEVY_DB_PATH: /data/levy.db
      LEVY_WEBHOOK_KEY_PATH: /keys/webhook-signing-key.pem
      LEVY_WEBHOOK_PUBLIC_KEY_PATH: /data/webhook-public-key.pem
    volumes:
      - levy-data:/data
      - levy-keys:/keys
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  api:
    build:
      # Repo root: the API imports keeper/src. See /.dockerignore.
      context: ..
      dockerfile: ops/Dockerfile.api
    image: levy-api:latest
    container_name: levy-api
    env_file:
      - .env
    environment:
      LEVY_DB_PATH: /data/levy.db
      LEVY_WEBHOOK_PUBLIC_KEY_PATH: /data/webhook-public-key.pem
      # Fixed inside the container; LEVY_API_PORT only picks the host port.
      LEVY_API_PORT: "3001"
    ports:
      # Host loopback only: put a TLS reverse proxy (nginx/Caddy) in front, and
      # rate-limit POST /api/auth/challenge there (see api/README.md).
      - "127.0.0.1:${LEVY_API_PORT:-3001}:3001"
    volumes:
      - levy-data:/data
    restart: unless-stopped
    depends_on:
      - keeper
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  levy-data:
    name: levy-data
  levy-keys:
    name: levy-keys
