name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same pull request cancels the run in progress. Other runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Contracts (forge)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - name: Build
        run: forge build --sizes

      # The ci profile fuzzes invariants at 1000 runs x depth 40; the default
      # 256 x 15 missed the resume bug.
      - name: Test (ci profile)
        env:
          FOUNDRY_PROFILE: ci
        run: forge test -vvv

      # The keeper loads these ABIs at runtime and they are regenerated by hand,
      # so fail when one no longer matches its contract.
      - name: Keeper ABIs match the contracts
        run: |
          for c in FeeRouter MockPermit2 MockUSDC SubscriptionManager; do
            forge inspect "$c" abi --json > "$RUNNER_TEMP/$c.json"
            node -e 'const f=require("fs");const n=p=>JSON.stringify(JSON.parse(f.readFileSync(p,"utf8")));if(n(process.argv[1])!==n(process.argv[2])){console.error("keeper/abi/"+process.argv[3]+".json is stale; regenerate with: forge inspect "+process.argv[3]+" abi --json");process.exit(1)}' \
              "$RUNNER_TEMP/$c.json" "keeper/abi/$c.json" "$c"
          done

  keeper:
    name: Keeper (node --test)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keeper
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The integration test spawns anvil.
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: keeper/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # The Docker files broke silently once (the API image could not build);
  # build both images and start the API for real.
  docker:
    name: Docker images
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: |
          docker build -f ops/Dockerfile.api -t levy-api:ci .
          docker build -f ops/Dockerfile.keeper -t levy-keeper:ci keeper
      - name: API container serves and enforces sign-in
        run: |
          docker run -d --name api -e LEVY_PUBLIC_ORIGIN=http://localhost:3001 -p 127.0.0.1:3001:3001 levy-api:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3001/api/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:3001/api/health
          curl -fsS -o /dev/null http://127.0.0.1:3001/
          curl -fsS -o /dev/null http://127.0.0.1:3001/public/auth.js
          curl -fsS -o /dev/null http://127.0.0.1:3001/checkout.html
          curl -fsS http://127.0.0.1:3001/api/config
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/api/metrics)" = 401
      - name: API refuses to start without LEVY_PUBLIC_ORIGIN
        run: "! docker run --rm levy-api:ci"
      - name: API refuses to start holding the keeper key
        run: |
          ! docker run --rm -e LEVY_PUBLIC_ORIGIN=http://localhost:3001 -e LEVY_KEEPER_KEY=0x01 levy-api:ci > api-key.log 2>&1
          grep -q "LEVY_KEEPER_KEY is set" api-key.log
      - name: Compose gives secrets to the keeper only
        run: |
          cp ops/.env.example ops/.env
          cp ops/keeper.env.example ops/keeper.env
          docker compose -f ops/docker-compose.yml --env-file ops/.env config --format json > compose.json
          python3 - <<'PY'
          import json
          s = json.load(open("compose.json"))["services"]
          for name in ("LEVY_KEEPER_KEY", "LEVY_WEBHOOK_KEY", "LEVY_WEBHOOK_KEY_PATH"):
              assert name not in s["api"].get("environment", {}), f"api has {name}"
          assert "LEVY_KEEPER_KEY" in s["keeper"]["environment"], "keeper has no LEVY_KEEPER_KEY"
          for svc in ("api", "keeper"):
              print(svc, [(v.get("source"), v["target"]) for v in s[svc]["volumes"]])
          assert not any(v["target"] == "/keys" or v.get("source") == "levy-keys" for v in s["api"]["volumes"]), "api mounts the signing key"
          assert any(v["target"] == "/keys" for v in s["keeper"]["volumes"]), "keeper has no key volume"
          PY
      - name: Keeper image loads (stops at missing config)
        run: docker run --rm levy-keeper:ci 2>&1 | grep -q "missing env var LEVY_MANAGER_ADDRESS"
      - name: API logs
        if: always()
        run: docker logs api || true

  api:
    name: API (node --test)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
