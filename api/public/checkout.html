<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Levy Checkout</title>
<link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
<style>
  :root { --bg: #0f1115; --panel: #171b22; --line: #262c36; --text: #e6e9ee; --muted: #8b94a3; --accent: #4cc38a; --warn: #e5a54b; --bad: #e5604f; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; } /* the dl's display: grid would otherwise override it */
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: center; }
  header h1 { font-size: 18px; margin: 0; }
  header h1 span { color: var(--accent); }
  main { max-width: 560px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 16px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; }
  .price { font-size: 28px; font-weight: 700; }
  .price small { font-size: 14px; font-weight: 400; color: var(--muted); }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 16px 0 0; font-size: 13px; }
  dt { color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  .mono { font-family: ui-monospace, monospace; }
  label { display: block; color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  input[type=number] { width: 90px; background: #0f1115; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 8px 10px; font: inherit; }
  button { font: inherit; background: var(--accent); color: #0b0e12; border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; font-weight: 600; width: 100%; }
  button:disabled { opacity: .45; cursor: default; }
  .muted { color: var(--muted); }
  .note { font-size: 13px; color: var(--muted); }
  #status { min-height: 20px; font-size: 13px; }
  #status.warn { color: var(--warn); }
  #status.bad { color: var(--bad); }
  #status.ok { color: var(--accent); }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Levy <span>Checkout</span></h1>
</header>
<main>
  <section class="card" id="plan">
    <p class="muted" id="planMsg">Loading plan...</p>
  </section>

  <section class="card" id="pay" hidden>
    <label for="cycles">Approve USDC for this many billing cycles</label>
    <div style="display:flex;gap:12px;align-items:center;margin-bottom:12px">
      <input type="number" id="cycles" min="1" max="120" value="12">
      <span class="muted" id="budget"></span>
    </div>
    <dl id="walletInfo" hidden>
      <dt>Wallet</dt><dd class="mono" id="account"></dd>
      <dt>USDC balance</dt><dd id="balance"></dd>
      <dt>Levy allowance now</dt><dd id="allowanceNow"></dd>
    </dl>
    <p class="note">The allowance is added to what you have already approved for Levy, since all your Levy subscriptions draw from it. Levy can only pull this plan's price each cycle, and only to this merchant. Cancel any time from the <a href="/portal.html">portal</a>.</p>
    <button id="connect">Connect wallet</button>
    <button id="go" hidden>Approve and subscribe</button>
    <p id="status"></p>
  </section>
</main>

<script src="/public/wallet.js"></script>
<script src="/public/checkout.js"></script>
</body>
</html>
