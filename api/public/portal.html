<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Levy — My Subscriptions</title>
<style>
  :root { --bg: #0f1115; --panel: #171b22; --line: #262c36; --text: #e6e9ee; --muted: #8b94a3; --accent: #4cc38a; --warn: #e5a54b; --bad: #e5604f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 16px 24px; border-bottom: 1px solid var(--line); display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header h1 span { color: var(--accent); }
  main { max-width: 900px; margin: 0 auto; padding: 24px; display: grid; gap: 16px; }
  .sub { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  .sub h2 { margin: 0 0 8px; font-size: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin: 12px 0; }
  .grid .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .grid .value { font-size: 18px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  td.addr { font-family: ui-monospace, monospace; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; }
  .pill.active, .pill.trial { background: rgba(76,195,138,.15); color: var(--accent); }
  .pill.past_due { background: rgba(229,165,75,.15); color: var(--warn); }
  .pill.paused, .pill.cancelled { background: rgba(229,96,79,.15); color: var(--bad); }
  input, button { font: inherit; }
  input[type=text] { background: #0f1115; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 8px 10px; }
  button { background: var(--accent); color: #0b0e12; border: 0; border-radius: 6px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
  button:disabled { opacity: .45; cursor: default; }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); }
  .note { background: #0f1115; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; font-size: 13px; color: var(--muted); }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Levy <span>Subscriptions</span></h1>
  <div class="row">
    <span id="who" class="muted"></span>
    <button id="signIn">Sign in with wallet</button>
    <button id="signOut" class="ghost" hidden>Sign out</button>
  </div>
  <span class="muted" style="margin-left:auto"><a href="/">merchant dashboard</a></span>
</header>
<main id="main">
  <p class="empty">Sign in with your wallet to see your subscriptions and invoices.</p>
</main>

<script src="/public/auth.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const short = (a) => a ? a.slice(0, 6) + "..." + a.slice(-4) : "";
const pill = (t) => `<span class="pill ${t}">${t}</span>`;

function showSession() {
  const s = LevyAuth.address;
  $("who").textContent = s ? `signed in as ${short(s)}` : "";
  $("signIn").hidden = !!s;
  $("signOut").hidden = !s;
}

async function load() {
  showSession();
  const s = LevyAuth.address;
  if (!s) return;
  const subs = await LevyAuth.api(`/api/subscriptions?subscriber=${s}`);
  const main = $("main");
  if (!subs.length) { main.innerHTML = `<p class="empty">No subscriptions found for this address.</p>`; return; }
  const cards = await Promise.all(subs.map(async (sub) => {
    const detail = await LevyAuth.api(`/api/subscriptions/${sub.subId}`);
    const invoices = (detail.charges || []).map(c => `<tr>
      <td class="addr">${short(c.invoiceRef)}</td><td>$${c.amountUsdc}</td>
      <td>$${c.feeUsdc}</td><td class="addr">${short(c.txHash)}</td></tr>`).join("");
    return `<div class="sub">
      <h2>Subscription #${sub.subId} ${pill(sub.statusName)}</h2>
      <div class="grid">
        <div><div class="label">Price</div><div class="value">$${sub.priceUsdc}</div></div>
        <div><div class="label">Next charge</div><div class="value" style="font-size:15px">${sub.nextChargeAtIso.slice(0, 10)}</div></div>
        <div><div class="label">Failed attempts</div><div class="value">${sub.failedAttempts}</div></div>
        <div><div class="label">Merchant</div><div class="value addr" style="font-size:13px">${short(sub.merchant)}</div></div>
      </div>
      <div class="row">
        <button class="ghost" disabled title="Sign from your wallet: call pauseSubscription(${sub.subId}) on the Levy manager contract">Pause</button>
        <button class="ghost" disabled title="Sign from your wallet: call cancelSubscription(${sub.subId}) on the Levy manager contract">Cancel</button>
      </div>
      <p class="note">Pause and cancel are on-chain actions and must be signed from your wallet.
        This portal is read-only in M3 — use your wallet app to call
        <code>pauseSubscription(${sub.subId})</code> or <code>cancelSubscription(${sub.subId})</code>
        on the Levy SubscriptionManager contract. To change your allowance, update the USDC
        approval granted to the manager contract.</p>
      <h3 style="font-size:13px;margin:12px 0 4px">Invoice history</h3>
      ${invoices ? `<table><thead><tr><th>Invoice</th><th>Amount</th><th>Fee</th><th>Tx</th></tr></thead><tbody>${invoices}</tbody></table>`
                 : `<p class="muted">No charges yet.</p>`}
    </div>`;
  }));
  main.innerHTML = cards.join("");
}

$("signIn").onclick = () => LevyAuth.signIn().then(load).catch(e => alert("Sign-in failed: " + e.message));
$("signOut").onclick = () => LevyAuth.signOut().then(() => location.reload());
load().catch(e => { showSession(); if (LevyAuth.address) alert("Load failed: " + e.message); });
</script>
</body>
</html>
